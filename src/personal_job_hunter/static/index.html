<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI Job Hunter — Autonomous HITL Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="logo-group">
        <span class="logo-badge">AI AGENT</span>
        <h1 class="app-title">Personal AI Job Hunter</h1>
      </div>

      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="review">Review Inbox <span id="nav-review-badge">(-)</span></button>
        <button class="nav-tab" data-tab="all">All Ranked Jobs</button>
        <button class="nav-tab" data-tab="applications">Tracked Applications</button>
        <button class="nav-tab" data-tab="stats">System Stats</button>
      </nav>

      <div class="header-actions">
        <button id="btn-run-pipeline" class="btn btn-primary">⚡ Run Pipeline</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-layout">

    <!-- Stats Ribbon -->
    <section class="stats-grid" id="stats-ribbon">
      <div class="stat-card">
        <span class="stat-label">Canonical Jobs</span>
        <span class="stat-value" id="stat-total-jobs">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">APPLY Targets</span>
        <span class="stat-value" style="color: var(--accent-apply);" id="stat-apply">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">STRETCH Opps</span>
        <span class="stat-value" style="color: var(--accent-stretch);" id="stat-stretch">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending Review</span>
        <span class="stat-value" style="color: var(--accent-cyan);" id="stat-pending">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Ready To Apply</span>
        <span class="stat-value" style="color: var(--accent-primary);" id="stat-ready">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Applied</span>
        <span class="stat-value" style="color: #60a5fa;" id="stat-applied">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Interviewing</span>
        <span class="stat-value" style="color: #c084fc;" id="stat-interviewing">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Offers</span>
        <span class="stat-value" style="color: #facc15;" id="stat-offers">-</span>
      </div>
    </section>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <input type="text" id="filter-search" class="search-input" placeholder="Search by role, company, or location...">
      <select id="filter-rec" class="filter-select">
        <option value="">All Recommendations</option>
        <option value="APPLY">APPLY (High Priority)</option>
        <option value="STRETCH">STRETCH (Eligible)</option>
        <option value="SKIP">SKIP (Disqualified)</option>
      </select>
      <select id="filter-mode" class="filter-select">
        <option value="">All Work Modes</option>
        <option value="Remote">Remote</option>
        <option value="Hybrid">Hybrid</option>
        <option value="On-site">On-site</option>
      </select>
      <button id="btn-refresh" class="btn btn-outline">🔄 Refresh</button>
    </section>

    <!-- Job Cards Grid -->
    <section class="job-grid" id="jobs-container">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
        Loading opportunities...
      </div>
    </section>

  </main>

  <!-- Job Details Modal Drawer -->
  <div class="modal-backdrop" id="job-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close-btn">&times;</button>
      <div id="modal-body">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
